version: "1.0.0"
governance: "ADR-051"
last_updated: "2026-08-19"

concepts:
  - id: "CASPersistence"
    name: "Compare-And-Swap Single-Writer Persistence"
    domain: "Storage & Concurrency"
    governing_adr: "ADR-050"
    governing_spec: "SPEC-KERNEL-001"
    definition: "Atomic state transition mechanism in SQLite WAL mode using BEGIN IMMEDIATE with rowcount == 1 assertion to prevent split-brain under concurrency."
    invariants:
      - "Only 1 active writer lease per state machine."
      - "Transitions must fail closed if lease_version mismatches."
    relationships:
      mitigates: ["SplitBrain", "LostUpdates", "RaceConditions"]
      requires: ["SQLiteWAL"]

  - id: "HermeticSandbox"
    name: "Hermetic Sandbox Isolation"
    domain: "Compute & Execution Plane"
    governing_adr: "ADR-048"
    governing_spec: "SPEC-KERNEL-001"
    definition: "Execution boundary for agent test execution using unshared network namespaces (Bubblewrap / Windows Job Objects) with read-only root and ephemeral workspaces."
    invariants:
      - "Zero network egress during test falsifier execution."
      - "Host credentials and environment variables must not leak into worker."
    relationships:
      mitigates: ["HostTampering", "SecretLeakage", "EgressPoisoning"]

  - id: "SubstrateAdmissionGate"
    name: "Substrate Admission Gate (SAG)"
    domain: "Governance & Quality Plane"
    governing_adr: "ADR-044"
    governing_spec: "SPEC-SPECGRAPH-001"
    definition: "Deterministic gate in SpecGraph that validates if code modifications strictly correspond to ratified Acceptance Criteria (AC-01..N) before release landing."
    invariants:
      - "No unmapped code transitions without formal @spec linkage."
      - "Fails closed on hash mismatches."
    relationships:
      governs: ["ReleaseTrains", "SpecCompliance"]
      enforces: ["SpecDrivenDevelopment"]

  - id: "ContextDiet"
    name: "Context Diet & Surgical Envelopes"
    domain: "AX & Memory Management"
    governing_adr: "ADR-044"
    governing_spec: "SPEC-SPECGRAPH-001"
    definition: "Constraint enforcing that prompt context envelopes must remain below 4,000 tokens by extracting only the relevant causal sub-graph."
    invariants:
      - "Zero raw codebase dumping into LLM prompts."
      - "Payloads must be bounded and scoped to task AST dependencies."
    relationships:
      mitigates: ["AttentionDegradation", "TokenBudgetExhaustion"]

  - id: "TripartiteRoundTable"
    name: "Tripartite Multi-Seat Consensus"
    domain: "Deliberation & Architectural Governance"
    governing_adr: "ADR-047"
    governing_spec: "SPEC-DIALOG-001"
    definition: "Quorum-based architectural review protocol involving 3 independent LLM vendor seats (Google Gemini, Anthropic Claude, OpenAI GPT) under Human direction."
    invariants:
      - "Deliberations must feature explicit Non-Goals (Via Negativa)."
      - "Consensus requires quantifiable confidence thresholds."
    relationships:
      governs: ["ADRs", "NorthStars", "EcosystemSplits"]

  - id: "FailSafeExclusionWins"
    name: "Fail-Safe Exclusion Precedence"
    domain: "Path Resolution & Security"
    governing_adr: "ADR-044"
    governing_spec: "SPEC-SPECGRAPH-001"
    definition: "Path matching rule stating that any match in excluded_paths unconditionally excludes the file, overriding any specific inclusion pattern."
    invariants:
      - "is_governed(p) = matches(p, governed) AND NOT matches(p, excluded)."
