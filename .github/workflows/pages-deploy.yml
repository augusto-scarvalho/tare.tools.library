name: Deploy research library to GitHub Pages

on:
  push:
    branches:
      - agent/semantic-preservation-curation-v2
    paths:
      - '.github/workflows/pages-deploy.yml'
      - '_config.yml'
      - '_data/**'
      - '_includes/**'
      - '_layouts/**'
      - 'assets/**'
      - 'studies/**'
      - 'research/**'
      - 'syntheses/**'
      - 'proposals/**'
      - 'experiments/**'
      - 'case-studies/**'
      - 'findings/**'
      - 'frontier/**'
      - 'sources/**'
      - 'catalog/**'
      - 'bridge-editions/**'
      - 'README.md'
      - 'NAVIGATION.md'
      - 'DOCUMENT_POLICY.md'
      - 'search.json'
      - 'scripts/validate_internal_links.py'
      - 'scripts/apply_signal_study_projection.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/agent/semantic-preservation-curation-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate repository-relative documentation links
        run: python scripts/validate_internal_links.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Apply SIGNAL projection to generated study editions
        run: python scripts/apply_signal_study_projection.py
      - name: Assert SIGNAL outputs
        shell: bash
        run: |
          test -f _site/assets/site.css
          test -f _site/assets/signal-study.css
          grep -q 'data-signal-projection="true"' _site/bridge-editions/2026-08-11/runtime-reliability-sandbox-scientific-refresh.html
          grep -q 'signal-study.css' _site/bridge-editions/2026-08-11/runtime-reliability-sandbox-scientific-refresh.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/agent/semantic-preservation-curation-v2'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
