name: Pages incumbent retired

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Report retirement state
        run: |
          echo "The semantic-preservation-v2 Pages deploy owner is retired."
          echo "This workflow intentionally has no Pages write permission, Pages artifact upload, or Pages deployment step."
          echo "The previously deployed public site remains served until a separately authorized owner performs a new deployment."
