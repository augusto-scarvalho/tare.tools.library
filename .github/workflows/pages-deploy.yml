name: Deploy research library to GitHub Pages

on:
  push:
    branches:
      - agent/semantic-preservation-curation-v2
    paths:
      - '.github/workflows/pages-deploy.yml'
      - '_config.yml'
      - '_data/**'
      - '_includes/**'
      - '_layouts/**'
      - 'assets/**'
      - 'studies/**'
      - 'research/**'
      - 'syntheses/**'
      - 'proposals/**'
      - 'experiments/**'
      - 'case-studies/**'
      - 'findings/**'
      - 'frontier/**'
      - 'sources/**'
      - 'catalog/**'
      - 'bridge-editions/**'
      - 'README.md'
      - 'NAVIGATION.md'
      - 'DOCUMENT_POLICY.md'
      - 'search.json'
      - 'scripts/validate_internal_links.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/agent/semantic-preservation-curation-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate repository-relative documentation links
        run: python scripts/validate_internal_links.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/agent/semantic-preservation-curation-v2'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
