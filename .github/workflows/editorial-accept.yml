name: editorial-accept

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Third-party submission PR number
        required: true
        type: string
      pages_approved:
        description: Approve its requested Pages projection
        required: true
        default: false
        type: boolean
      notes:
        description: Editorial acceptance notes
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted automation at main
        uses: actions/checkout@v4
        with:
          ref: main
          path: automation
      - name: Verify maintainer and fetch submission without executing it
        id: submission
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          permission=$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) echo "DENY actor lacks maintainer permission"; exit 1;; esac
          author=$(gh pr view "$PR" --repo "$REPOSITORY" --json author --jq .author.login)
          head=$(gh pr view "$PR" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)
          test "$author" != "$ACTOR" || { echo "DENY submitter cannot accept their own submission"; exit 1; }
          git -C automation fetch origin "pull/$PR/head:refs/remotes/origin/submission-$PR"
          changed=$(git -C automation diff --name-only origin/main "refs/remotes/origin/submission-$PR" -- incoming)
          manifests=$(printf '%s\n' "$changed" | grep '/PUBLISH_MANIFEST.json$' || true)
          test "$(printf '%s\n' "$manifests" | sed '/^$/d' | wc -l)" -eq 1 || { echo "DENY submission must add exactly one packet manifest"; exit 1; }
          test "$(printf '%s\n' "$changed" | grep -Ev '^incoming/[^/]+/' | wc -l)" -eq 0 || { echo "DENY submission changes outside one incoming packet"; exit 1; }
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "packet=${manifests%/PUBLISH_MANIFEST.json}" >> "$GITHUB_OUTPUT"
      - name: Add formal decision to an Acceptance PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          PAGES_APPROVED: ${{ inputs.pages_approved }}
          NOTES: ${{ inputs.notes }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ steps.submission.outputs.author }}
          HEAD: ${{ steps.submission.outputs.head }}
          PACKET: ${{ steps.submission.outputs.packet }}
        run: |
          set -euo pipefail
          branch="editorial/accept-pr-$PR-$HEAD"
          git -C automation worktree add ../submission "$HEAD"
          python automation/tools/editorial_decision.py "submission/$PACKET" --decision-id "editorial.pr$PR.$(date -u +%Y%m%d%H%M%S)" --submission-repository "$REPOSITORY" --submission-pr "$PR" --submission-head-sha "$HEAD" --submission-author "$AUTHOR" --reviewer "$ACTOR" --reviewer-name "$ACTOR" --reviewed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --notes "$NOTES" $([ "$PAGES_APPROVED" = true ] && echo --pages-approved)
          git -C submission switch -c "$branch"
          git -C submission add -- "$PACKET/EDITORIAL_DECISION.json"
          git -C submission -c user.name='tare editorial automation' -c user.email='editorial@tare.tools' commit -m "docs: record editorial acceptance for PR $PR"
          git -C submission push origin "$branch"
          gh pr create --repo "$REPOSITORY" --head "$branch" --base main --title "docs: accept submission PR #$PR" --body "Maintainer-owned editorial decision for submission #$PR. The source packet is retained as evidence; this does not ratify architecture."
