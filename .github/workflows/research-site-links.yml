name: Research site validation

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.html'
      - '_config.yml'
      - '_data/**'
      - '_layouts/**'
      - '_includes/**'
      - 'assets/**'
      - 'scripts/validate_internal_links.py'
      - '.github/workflows/research-site-links.yml'
  push:
    branches:
      - main
      - agent/semantic-preservation-curation-v2
    paths:
      - '**/*.md'
      - '**/*.html'
      - '_config.yml'
      - '_data/**'
      - '_layouts/**'
      - '_includes/**'
      - 'assets/**'
      - 'scripts/validate_internal_links.py'
      - '.github/workflows/research-site-links.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate repository-relative documentation links
        run: python scripts/validate_internal_links.py
      - name: Build Jekyll reading projection
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          verbose: true
      - name: Assert critical site outputs
        shell: bash
        run: |
          test -f _site/index.html
          test -f _site/studies/index.html
          test -f _site/research/index.html
          test -f _site/NAVIGATION.html
          test -f _site/bridge-editions/2026-08-11/agent-os-foundations-scientific-refresh.html
          test -f _site/bridge-editions/2026-08-11/runtime-reliability-sandbox-scientific-refresh.html
          test -f _site/search.json
      - name: Upload generated site preview
        uses: actions/upload-artifact@v4
        with:
          name: research-site-preview
          path: _site
          if-no-files-found: error
          retention-days: 7
