name: pages-authority-proposal

on:
  pull_request:
    paths:
      - '.github/workflows/pages-authority-proposal.yml'
      - '.github/workflows/pages.yml'
      - 'site/PAGES_VISUAL_EVIDENCE.json'
      - 'tools/build_pages.py'
      - 'tools/validate_pages_contract.py'
      - 'tools/cutover_readiness.py'
      - 'tools/cutover_readiness_support.py'
      - 'tools/pages_cutover_authority.py'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate inactive authority proposal
        env:
          QUALIFIED_OWNER_COMMIT: 0d27bcddc9176ac8e4181ba0c808a6046c8791f2
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os

          bindings = {
              'owner_workflow_sha256': Path('.github/workflows/pages.yml'),
              'visual_evidence_sha256': Path('site/PAGES_VISUAL_EVIDENCE.json'),
              'build_pages_sha256': Path('tools/build_pages.py'),
              'pages_validator_sha256': Path('tools/validate_pages_contract.py'),
              'readiness_sha256': Path('tools/cutover_readiness.py'),
              'readiness_support_sha256': Path('tools/cutover_readiness_support.py'),
              'authority_validator_sha256': Path('tools/pages_cutover_authority.py'),
          }
          observed = {name: hashlib.sha256(path.read_bytes()).hexdigest() for name, path in bindings.items()}
          proposal = {
              'proposal_version': '1.0',
              'proposal_kind': 'pages-cutover-owner-authority-proposal',
              'proposal_status': 'NOT_AUTHORIZED',
              'repository': 'augusto-scarvalho/tare.tools.research',
              'candidate_record': {
                  'record_version': '1.0',
                  'record_kind': 'pages-cutover-owner-authority',
                  'repository': 'augusto-scarvalho/tare.tools.research',
                  'decision_id': 'pages.cutover.pending-owner-authority',
                  'decision': 'authorize-cutover',
                  'canary_id': 'research.pages.canary.v1',
                  'candidate_deploy_owner': '.github/workflows/pages.yml@main',
                  'qualified_owner_commit': os.environ['QUALIFIED_OWNER_COMMIT'],
                  'authorized_at': None,
                  'owner': {
                      'identity_ref': 'github:augusto-scarvalho',
                      'role': 'repository-owner',
                  },
                  'rollback_allowed': True,
                  'bindings': observed,
              },
              'activation_rule': 'This proposal is inert. It must not be copied to site/PAGES_CUTOVER_AUTHORITY.json until the repository owner explicitly authorizes the public Pages cutover.',
          }
          out = Path('authority-proposal/PAGES_CUTOVER_AUTHORITY.proposed.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(proposal, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY
      - name: Upload inactive proposal
        uses: actions/upload-artifact@v4
        with:
          name: pages-cutover-authority-proposal
          path: authority-proposal/PAGES_CUTOVER_AUTHORITY.proposed.json
          retention-days: 7
          if-no-files-found: error
