name: pages-shadow

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editorial dependencies
        run: python -m pip install -r requirements-editorial.txt
      - name: Run repository unit tests
        run: python -m unittest discover -s tests
      - name: Run publisher unit tests
        run: python -m unittest discover -s tools/publisher/tests
      - name: Validate repository contracts
        run: python tools/tare_docs.py validate-repo .
      - name: Checkout pinned stable Pages incumbent
        uses: actions/checkout@v4
        with:
          ref: f5b34297b26339e25267401e4fdefed381a827a3
          path: .incumbent-source
      - name: Build pinned incumbent projection
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.incumbent-source
          destination: ./site/_incumbent
      - name: Make generated incumbent readable
        run: sudo chown -R "$USER":"$USER" site/_incumbent
      - name: Build additive SIGNAL publication shadow
        run: python tools/build_pages.py --incumbent site/_incumbent --output site/_site --base-path /tare.tools.research/
      - name: Validate base path, links, semantic parity and incumbent parity
        run: python tools/validate_pages_contract.py site/_site --root . --incumbent site/_incumbent --base-path /tare.tools.research/
      - name: Upload shadow preview
        uses: actions/upload-artifact@v4
        with:
          name: signal-pages-shadow-preview
          path: site/_site
          retention-days: 7
          if-no-files-found: error
