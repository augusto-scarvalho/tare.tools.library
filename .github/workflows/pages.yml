name: pages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-editorial.txt
      - run: python tools/build_pages.py
      - run: python tools/validate_pages.py site/_site
      - uses: actions/upload-artifact@v4
        with: {name: signal-pages-preview, path: site/_site, retention-days: 7}
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with: {path: site/_site}
  deploy:
    if: github.event_name == 'push'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
