name: frozen-pages-projection

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-pages-projection
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install projection dependencies
        run: python -m pip install -r requirements-editorial.txt
      - name: Run repository tests
        run: python -m unittest discover -s tests
      - name: Validate repository contracts
        run: python tools/tare_docs.py validate-repo .
      - name: Checkout pinned stable Pages incumbent
        uses: actions/checkout@v4
        with:
          ref: f5b34297b26339e25267401e4fdefed381a827a3
          path: .incumbent-source
      - name: Build pinned incumbent projection
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.incumbent-source
          destination: ./site/_incumbent
      - name: Make generated incumbent readable
        run: sudo chown -R "$USER":"$USER" site/_incumbent
      - name: Build frozen SIGNAL reading projection
        run: python tools/build_pages.py --incumbent site/_incumbent --output site/_site --base-path /tare.tools.research/
      - name: Validate paths, links, semantic surface and incumbent parity
        run: python tools/validate_pages_contract.py site/_site --root . --incumbent site/_incumbent --base-path /tare.tools.research/
      - name: Upload read-only preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-pages-frozen-preview
          path: site/_site
          retention-days: 7
          if-no-files-found: error
