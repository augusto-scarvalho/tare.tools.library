<nav class="site-nav" aria-label="Research library navigation">
  {% for section in site.data.navigation %}
  <details class="nav-section" {% if section.open %}open{% endif %}>
    <summary>{{ section.title }}</summary>
    <div class="nav-items">
      {% for item in section.items %}
      {% assign href = item.url | relative_url %}
      <a class="nav-link{% if page.url == item.url %} is-active{% endif %}" href="{{ href }}">
        <span>{{ item.title }}</span>
        {% if item.kind == 'html' %}<span class="nav-badge">HTML</span>{% endif %}
      </a>
      {% endfor %}
    </div>
  </details>
  {% endfor %}
</nav>
