title: tare.tools research
description: Living research library for the tare.tools Agent Operating System
url: https://augusto-scarvalho.github.io
baseurl: /tare.tools.research
repository: augusto-scarvalho/tare.tools.research
repository_url: https://github.com/augusto-scarvalho/tare.tools.research
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: true
readme_index:
  enabled: true
  remove_originals: false
titles_from_headings:
  enabled: true
  strip_title: false
  collections: true
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
exclude:
  - .github
  - scripts
  - vendor
  - Gemfile
  - Gemfile.lock
  - "*.bundle"
  - "*.zip"
